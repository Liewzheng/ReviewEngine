name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md

  upload-assets:
    name: Upload ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Install x86_64-apple-darwin target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: review-engine
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256

  upload-frontend-dist:
    name: Upload Frontend Dist
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      # 在 frontend/ 内打包:tar 包根即为 index.html + assets/(Docker 零编译
      # 镜像可直接 COPY frontend-dist.tar.gz 解包到 /app/frontend/dist)
      - name: Package frontend dist
        working-directory: frontend
        run: tar -czf frontend-dist.tar.gz -C dist .

      # taiki-e/upload-release-assets-action 仓库不存在(404,历次发版即失败),
      # 改用 GitHub CLI 上传同一资产——GITHUB_REF_NAME 即 tag 名(v0.9.10)。
      - name: Upload frontend dist asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" frontend/frontend-dist.tar.gz --clobber

  push-ghcr:
    name: Publish GHCR Image
    needs: [upload-assets, upload-frontend-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v2

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          build-args: REVIEW_ENGINE_VERSION=${{ github.ref_name }}
          tags: ghcr.io/liewzheng/review-engine:${{ github.ref_name }}, ghcr.io/liewzheng/review-engine:latest
          push: true
