version: "3.8"

# Review-Engine SaaS Deployment for GitLab EE
# Usage: cp .env.example .env && docker compose up -d

services:
  # ─── Main Review-Engine Service ───────────────────────────────────────
  review-engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 零编译:必填,对应 GitHub Release tag(如 v0.9.8);未设置时镜像构建快速失败
        REVIEW_ENGINE_VERSION: ${REVIEW_ENGINE_VERSION:-}
    restart: unless-stopped

    ports:
      # ── HTTPS(默认启用)──
      # serve 内置 TLS 在容器内 8443(--tls-port)终结,映射到宿主机
      # ${REVIEW_TLS_PORT:-443}。需要 .env 中同时设置 REVIEW_TLS_CERT 与
      # REVIEW_TLS_KEY(见下方环境变量),且 ./tls/cert.pem、./tls/key.pem 存在。
      - "${REVIEW_TLS_PORT:-443}:8443"

      # ── 可选:纯 HTTP 直连(默认关闭)──
      # 容器内 8080 始终存在(健康检查用)。如需在内网直连 HTTP,取消下面注释
      # 并在 .env 设 REVIEW_ENABLE_HTTP=true(仅建议受信内网使用):
      # - "${REVIEW_ENGINE_PORT:-18080}:8080"

    environment:
      # ── API Authentication ──
      # Required for non-localhost binding.
      # The backend uses this token to authenticate API requests. The frontend
      # web UI prompts the user to enter this same token on first visit; it is
      # then saved in the browser's localStorage and sent as a Bearer token.
      REVIEW_API_TOKEN: ${REVIEW_API_TOKEN:?REVIEW_API_TOKEN is required}

      # ── GitLab EE Integration ──
      # At least one of GITLAB_WEBHOOK_SECRET or GITLAB_WEBHOOK_SIGNING_SECRET must be configured
      GITLAB_TOKEN: ${GITLAB_TOKEN:?GITLAB_TOKEN is required}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      GITLAB_WEBHOOK_SIGNING_SECRET: ${GITLAB_WEBHOOK_SIGNING_SECRET:-}

      # ── GitLab EE URL (self-hosted) ──
      # Set this to your GitLab EE instance URL
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.example.com}

      # ── LLM Configuration ──
      # JSON array of LLM provider configs (OpenAI, Anthropic, etc.)
      # Example: [{"provider":"openai","model":"gpt-4o","api_key":"sk-..."}]
      LLM_CONFIG: ${LLM_CONFIG:?LLM_CONFIG is required}

      # ── Native HTTPS (TLS) ──
      # serve 内置 TLS 开关:两个都设为非空(如 true)即启用,容器内监听 8443;
      # 留空 → 纯 HTTP 8080(fail-soft)。它们是开关而非文件路径,证书/私钥
      # 通过下方 TLS_CERT_PATH/TLS_KEY_PATH 只读卷挂载到固定容器路径:
      #   /app/tls/cert.pem   /app/tls/key.pem
      REVIEW_TLS_CERT: ${REVIEW_TLS_CERT:-}
      REVIEW_TLS_KEY: ${REVIEW_TLS_KEY:-}

      # ── Logging ──
      RUST_LOG: ${RUST_LOG:-info}
      # Backend reads REVIEW_LOG_FORMAT (src/main.rs); RUST_LOG_FORMAT is ignored.
      REVIEW_LOG_FORMAT: ${REVIEW_LOG_FORMAT:-json}

      # ── Config & Output Paths ──
      REVIEW_ENGINE_CONFIG_DIR: /app/config
      REVIEW_ENGINE_REPORT_DIR: /app/reports

      # ── In-container Auto Upgrade (容器内自动升级) ──
      # 升级由容器内 POST /upgrade 触发:新二进制替换到 REVIEW_UPGRADE_INSTALL_DIR
      # (卷 /app/bin)、新前端 dist 替换到 REVIEW_UPGRADE_FRONTEND_DIR(卷
      # /app/frontend/dist),完成后进程 exit(0),由 restart: unless-stopped 自动
      # 重启容器拉起新版本(无需重新 build/拉镜像)。
      REVIEW_UPGRADE_INSTALL_DIR: /app/bin
      REVIEW_UPGRADE_FRONTEND_DIR: /app/frontend/dist

    volumes:
      # Persist config file (mounted from host or created via init)
      - type: bind
        source: ${CONFIG_PATH:-./config}
        target: /app/config
        read_only: true

      # Persist review reports
      - type: bind
        source: ${REPORTS_PATH:-./reports}
        target: /app/reports

      # SSH keys for GitLab access (if using SSH clone)
      - type: bind
        source: ${SSH_KEY_PATH:-~/.ssh}
        target: /app/.ssh
        read_only: true

      # TLS certificate & private key for native HTTPS (read-only)
      # 宿主路径默认 ./tls/cert.pem 与 ./tls/key.pem。`docker compose up` 前
      # 必须先生成(源文件不存在 compose 会报错),生成方式:
      #   mkdir -p tls
      #   openssl req -x509 -newkey rsa:2048 -nodes \
      #     -keyout tls/key.pem -out tls/cert.pem -days 365 \
      #     -subj "/CN=<your-host>" -addext "subjectAltName=DNS:<your-host>"
      - type: bind
        source: ${TLS_CERT_PATH:-./tls/cert.pem}
        target: /app/tls/cert.pem
        read_only: true
      - type: bind
        source: ${TLS_KEY_PATH:-./tls/key.pem}
        target: /app/tls/key.pem
        read_only: true

      # ── Writable deploy volumes(容器内自动升级用,非 read_only)──
      # ./bin  → /app/bin:后端升级时替换的二进制就写在这里,entrypoint 从卷运行
      # ./frontend-dist → /app/frontend/dist:升级时替换的前端 dist 写在这里,
      #   serve 直接读它(/app/frontend/dist 或 ./frontend/dist)。
      # 首次启动 entrypoint 会把镜像内内容(二进制 /usr/local/bin/review-engine、
      # dist 备份 /app/frontend-dist-image)同步进卷;卷已有内容则不覆盖。
      # 注意:Linux NAS 上 bind 卷属主继承宿主,若容器内 review-engine 写卷失败,
      #   需先把这两个目录 chown 到容器 UID(如 `chown -R 999:999 bin frontend-dist`,
      #   实际 UID 以 `docker exec <c> id review-engine` 为准)。
      # 两个目录是独立可写部署卷,可单独备份/回滚(如保留升级前的 bin/review-engine)。
      - type: bind
        source: ./bin
        target: /app/bin
      - type: bind
        source: ./frontend-dist
        target: /app/frontend/dist

    # Resource limits for SaaS stability
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - review-engine-net

  # ─── HTTPS:由 review-engine serve 内置 TLS 提供(无需 Caddy/nginx 反代) ──
  # 在 .env 设置 REVIEW_TLS_CERT + REVIEW_TLS_KEY(非空)并生成
  # ./tls/cert.pem + ./tls/key.pem(见上方卷注释)。TLS 在容器内 8443 终结,
  # 映射到宿主机 ${REVIEW_TLS_PORT:-443};容器内 8080 仍用于健康检查。

  # ─── Optional: Redis for Task Queue (future scaling) ──────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: review-engine-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - review-engine-net

networks:
  review-engine-net:
    driver: bridge
